services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modulego
      POSTGRES_PASSWORD: modulego
      POSTGRES_DB: modulego
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Only exposed internally to the app service — not to the host.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulego"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "5000:5000"
    # Loads optional Supabase/Gemini keys — app works fine without this file
    # but comparison features and chatbot degrade gracefully without it.
    env_file: .env
    environment:
      # Set DATABASE_URL to use PostgreSQL; omit it to fall back to SQLite.
      DATABASE_URL: postgresql://modulego:modulego@postgres:5432/modulego
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
