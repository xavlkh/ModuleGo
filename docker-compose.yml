services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modulego}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modulego}
      POSTGRES_DB: ${POSTGRES_DB:-modulego}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modulego}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    image: ghcr.io/xavlkh/modulego:c95b6ee
    ports:
      - "${APP_PORT:-5000}:5000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
