# CI/CD pipeline: build Docker image → push to GHCR → deploy to EC2 via Ansible
# master branch → production (port 80), dev branch → development (port 5001)
name: CD

on:
  push:
    branches: [master, dev]

# Don't cancel in-progress deploys — a half-finished deploy leaves the server in a broken state
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      environment: ${{ steps.env.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect target environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy (${{ needs.build.outputs.environment }})
    needs: build
    runs-on: ubuntu-latest
    # Dynamic environment name preserves GitHub environment protection rules (approval gates)
    environment: ${{ needs.build.outputs.environment == 'prod' && 'production' || 'development' }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Map environment to config — avoids duplicating the entire deploy job for prod/dev
      - name: Resolve deploy settings
        id: settings
        run: |
          ENV="${{ needs.build.outputs.environment }}"
          if [ "$ENV" = "prod" ]; then
            echo "ssh_key=modulego-prod.pem" >> $GITHUB_OUTPUT
            echo "inventory=ansible/inventory/prod.ini" >> $GITHUB_OUTPUT
            echo "port=80" >> $GITHUB_OUTPUT
          else
            echo "ssh_key=modulego-dev.pem" >> $GITHUB_OUTPUT
            echo "inventory=ansible/inventory/dev.ini" >> $GITHUB_OUTPUT
            echo "port=5001" >> $GITHUB_OUTPUT
          fi

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/${{ steps.settings.outputs.ssh_key }}
          chmod 600 ~/.ssh/${{ steps.settings.outputs.ssh_key }}
          ssh-keyscan -H ${{ vars.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to EC2 via Ansible
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          ansible-playbook -i ${{ steps.settings.outputs.inventory }} ansible/playbook.yml -e "ansible_host=${{ vars.EC2_IP }} env=${{ needs.build.outputs.environment }} ghcr_token=${{ secrets.GITHUB_TOKEN }} gemini_api_key=${{ secrets.GEMINI_API_KEY }} flask_secret_key=${{ secrets.FLASK_SECRET_KEY }} commit_hash=${COMMIT_SHA}"

      - name: Verify deployment
        run: |
          sleep 5
          curl -sf http://${{ vars.EC2_IP }}:${{ steps.settings.outputs.port }} || exit 1
