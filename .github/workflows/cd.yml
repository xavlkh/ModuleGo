# CI/CD pipeline: build Docker image → push to GHCR → deploy to EC2 via Ansible
# master branch → production (port 80), dev branch → development (port 5001)
name: Build & Deploy

on:
  push:
    branches: [master, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build Docker image and push to GitHub Container Registry
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      environment: ${{ steps.env.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploy to production EC2 when pushing to master
  deploy-prod:
    needs: build-and-push
    if: needs.build-and-push.outputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/modulego-prod.pem
          chmod 600 ~/.ssh/modulego-prod.pem
          ssh-keyscan -H ${{ vars.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to EC2
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          ansible-playbook -i ansible/inventory/prod.ini ansible/playbook.yml -e "ansible_host=${{ vars.EC2_IP }} env=prod ghcr_token=${{ secrets.GITHUB_TOKEN }} postgres_user=${{ secrets.POSTGRES_USER }} postgres_password=${{ secrets.POSTGRES_PASSWORD }} gemini_api_key=${{ secrets.GEMINI_API_KEY }} gemini_model=${{ vars.GEMINI_MODEL }} commit_hash=${COMMIT_SHA}"

      - name: Verify deployment
        run: |
          sleep 5
          curl -sf http://${{ vars.EC2_IP }} || exit 1

  # Deploy to dev EC2 when pushing to dev branch
  deploy-dev:
    needs: build-and-push
    if: needs.build-and-push.outputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/modulego-dev.pem
          chmod 600 ~/.ssh/modulego-dev.pem
          ssh-keyscan -H ${{ vars.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to EC2
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          ansible-playbook -i ansible/inventory/dev.ini ansible/playbook.yml -e "ansible_host=${{ vars.EC2_IP }} env=dev ghcr_token=${{ secrets.GITHUB_TOKEN }} postgres_user=${{ secrets.POSTGRES_USER }} postgres_password=${{ secrets.POSTGRES_PASSWORD }} gemini_api_key=${{ secrets.GEMINI_API_KEY }} gemini_model=${{ vars.GEMINI_MODEL }} commit_hash=${COMMIT_SHA}"

      - name: Verify deployment
        run: |
          sleep 5
          curl -sf http://${{ vars.EC2_IP }}:5001 || exit 1
