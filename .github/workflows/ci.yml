name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install ruff
        run: python -m pip install ruff

      - name: Install test coverage tools
        run: python -m pip install pytest-cov

      - name: Lint with Ruff
        run: ruff check

      - name: Compile Python source
        run: >-
          python -m compileall -q app.py auth_routes.py user_model.py
          db.py ownership.py tests

      - name: Run API tests with coverage
        run: >-
          python -m pytest -q
          --junitxml=pytest-report.xml
          --cov=.
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-python-${{ matrix.python-version }}
          path: pytest-report.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Check SonarQube Cloud configuration
        if: matrix.python-version == '3.12'
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Cloud is not configured yet
        if: matrix.python-version == '3.12' && steps.sonar-token.outputs.available != 'true'
        run: echo "Skipping analysis until the SONAR_TOKEN secret is added."

      - name: Run SonarQube Cloud analysis
        if: matrix.python-version == '3.12' && steps.sonar-token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security:
    name: Trivy Security Audit
    runs-on: ubuntu-latest
    # Non-blocking — scan is informational only
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-report.txt
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt
          retention-days: 30
