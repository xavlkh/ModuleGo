name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      SONAR_TOKEN: ${{ matrix.python-version == '3.12' && secrets.SONAR_TOKEN || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint with Ruff
        run: ruff check

      - name: Compile Python source
        run: >-
          python -m compileall -q app.py auth_routes.py user_model.py
          db.py ownership.py tests

      - name: Run API tests with coverage
        if: matrix.python-version == '3.12'
        run: >-
          python -m pytest -q
          --cov=.
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Run API tests
        if: matrix.python-version != '3.12'
        run: python -m pytest -q

      - name: SonarQube Cloud is not configured yet
        if: matrix.python-version == '3.12' && env.SONAR_TOKEN == ''
        run: echo "Skipping analysis until the SONAR_TOKEN secret is added."

      - name: Run SonarQube Cloud analysis
        if: matrix.python-version == '3.12' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v7

  security:
    name: Trivy Security Audit
    runs-on: ubuntu-latest
    # Non-blocking — scan is informational only
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-report.txt
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt
          retention-days: 30
