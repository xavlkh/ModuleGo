# CI/CD pipeline: build Docker image → push to GHCR → deploy to EC2 via Ansible
# main branch → production (port 5000), dev branch → development (port 5001)
name: Build & Deploy

on:
  push:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build Docker image and push to GitHub Container Registry
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      environment: ${{ steps.env.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tag images as "latest" for main branch, "dev" for dev branch
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: branch name (e.g. "dev"), "latest" on main, and short SHA
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploy to production EC2 when pushing to main
  deploy-prod:
    needs: build-and-push
    if: needs.build-and-push.outputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      # Write the SSH private key from secrets to a file Ansible can use
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/modulego-prod.pem
          chmod 600 ~/.ssh/modulego-prod.pem
          ssh-keyscan -H ${{ vars.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to EC2
        run: |
          ansible-playbook -i ansible/inventory/prod.ini ansible/playbook.yml --tags deploy

      - name: Verify deployment
        run: |
          sleep 15
          curl -sf http://${{ vars.EC2_IP }}:5000 || exit 1

  # Deploy to dev EC2 when pushing to dev branch
  deploy-dev:
    needs: build-and-push
    if: needs.build-and-push.outputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/modulego-dev.pem
          chmod 600 ~/.ssh/modulego-dev.pem
          ssh-keyscan -H ${{ vars.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to EC2
        run: |
          ansible-playbook -i ansible/inventory/dev.ini ansible/playbook.yml --tags deploy

      - name: Verify deployment
        run: |
          sleep 15
          curl -sf http://${{ vars.EC2_IP }}:5001 || exit 1
