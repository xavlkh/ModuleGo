# Manual workflow to scrape RP data and upsert to EC2 PostgreSQL
# Trigger: Actions tab → Run workflow → pick environment
name: Seed Database

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday 2am UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scraper dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python app/static/local-data/run_all.py
          echo "Scraped files:"
          ls -la app/static/local-data/data/*.json 2>&1 || echo "No JSON files found"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id.pem
          chmod 600 ~/.ssh/id.pem
          ssh-keyscan -H ${{ vars.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload files to EC2
        run: |
          if ! ls app/static/local-data/data/*.json 1>/dev/null 2>&1; then
            echo "ERROR: No JSON files found. Scraper may have failed."
            exit 1
          fi
          scp -i ~/.ssh/id.pem \
            app/static/local-data/data/*.json seed_db.py \
            ubuntu@${{ vars.EC2_IP }}:/tmp/

      - name: Seed database on EC2
        env:
          EC2_HOST: ${{ vars.EC2_IP }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ENV: ${{ inputs.environment || 'dev' }}
        run: |
          if [ "$ENV" = "dev" ]; then
            DB_NAME="modulego_dev"
            PROJECT_DIR="modulego-dev"
          else
            DB_NAME="modulego"
            PROJECT_DIR="modulego-prod"
          fi

          ssh -i ~/.ssh/id.pem ubuntu@${EC2_HOST} bash -s -- "$DB_NAME" "$PROJECT_DIR" "$POSTGRES_USER" "$POSTGRES_PASSWORD" << 'SCRIPT'
            set -e
            DB_NAME="$1"
            PROJECT_DIR="$2"
            PG_USER="$3"
            PG_PASS="$4"

            CONTAINER=$(docker compose -f /home/ubuntu/${PROJECT_DIR}/docker-compose.yml ps -q app)
            echo "Container: ${CONTAINER}"

            if [ -z "$CONTAINER" ]; then
              echo "ERROR: App container not found"
              exit 1
            fi

            docker cp /tmp/seed_db.py ${CONTAINER}:/app/seed_db.py
            docker cp /tmp/*.json ${CONTAINER}:/app/
            docker exec ${CONTAINER} sh -c "DATABASE_URL=postgresql://${PG_USER}:${PG_PASS}@postgres:5432/${DB_NAME} python seed_db.py"
            docker exec ${CONTAINER} rm -f /app/seed_db.py /app/*.json
          SCRIPT

      - name: Cleanup
        if: always()
        run: |
          ssh -i ~/.ssh/id.pem ubuntu@${{ vars.EC2_IP }} "rm -f /tmp/*.json /tmp/seed_db.py" || true
