# Manual workflow to scrape RP data and upsert to EC2 PostgreSQL
# Trigger: Actions tab → Run workflow → pick environment
name: Seed Database

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday 2am UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scraper dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python app/static/local-data/run_all.py
          echo "=== Scraper output ==="
          ls -la app/static/local-data/data/ || echo "No data directory"
          ls -la app/static/local-data/data/*.json 2>/dev/null || echo "No JSON files produced"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id.pem
          chmod 600 ~/.ssh/id.pem
          ssh-keyscan -H ${{ vars.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload to EC2 and seed
        env:
          EC2_IP: ${{ vars.EC2_IP }}
          PG_USER: ${{ secrets.POSTGRES_USER }}
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          SSH="ssh -i /home/runner/.ssh/id.pem ubuntu@${EC2_IP}"
          SCP="scp -i /home/runner/.ssh/id.pem"

          if [ "${{ inputs.environment || 'dev' }}" = "dev" ]; then
            DB_NAME="modulego_dev"
            COMPOSE_FILE="/home/ubuntu/modulego-dev/docker-compose.yml"
          else
            DB_NAME="modulego"
            COMPOSE_FILE="/home/ubuntu/modulego-prod/docker-compose.yml"
          fi

          echo "=== Checking local files ==="
          ls -la app/static/local-data/data/*.json seed_db.py 2>&1
          if ! ls app/static/local-data/data/*.json 1>/dev/null 2>&1; then
            echo "ERROR: No JSON files from scraper"
            exit 1
          fi

          echo "=== Uploading to EC2 ==="
          $SCP app/static/local-data/data/*.json seed_db.py ubuntu@${EC2_IP}:/tmp/
          echo "=== Verifying upload ==="
          $SSH "ls -la /tmp/seed_db.py /tmp/*.json"

          echo "=== Getting container ID ==="
          CONTAINER=$($SSH "docker compose -f ${COMPOSE_FILE} ps -q app" | tr -d '\r\n')
          echo "Container: [${CONTAINER}]"
          if [ -z "$CONTAINER" ]; then
            echo "ERROR: Container not found"
            exit 1
          fi

          echo "=== Copying seed_db.py into container ==="
          $SSH "docker cp /tmp/seed_db.py ${CONTAINER}:/app/seed_db.py"
          echo "=== Copying JSON files into container ==="
          for f in $($SSH "ls /tmp/*.json"); do
            $SSH "docker cp ${f} ${CONTAINER}:/app/"
          done

          echo "=== Running seed ==="
          $SSH "docker exec ${CONTAINER} sh -c 'DATABASE_URL=postgresql://${PG_USER}:${PG_PASS}@postgres:5432/${DB_NAME} python seed_db.py'"

          echo "=== Cleaning up container ==="
          $SSH "docker exec --user root ${CONTAINER} rm -f /app/seed_db.py /app/*.json" || true

      - name: Cleanup EC2 temp files
        if: always()
        run: |
          ssh -i ~/.ssh/id.pem ubuntu@${{ vars.EC2_IP }} "rm -f /tmp/*.json /tmp/seed_db.py" || true
