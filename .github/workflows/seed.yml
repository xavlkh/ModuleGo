# Manual workflow to scrape RP data and upsert to EC2 PostgreSQL
# Trigger: Actions tab → Run workflow → pick environment
name: Seed Database

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday 2am UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scraper dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python app/static/local-data/run_all.py

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id.pem
          chmod 600 ~/.ssh/id.pem
          ssh-keyscan -H ${{ vars.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload files to EC2
        run: |
          scp -i ~/.ssh/id.pem \
            app/static/local-data/data/*.json seed_db.py \
            ubuntu@${{ vars.EC2_IP }}:/tmp/

      - name: Run seed on EC2
        run: |
          SSH="ssh -i ~/.ssh/id.pem ubuntu@${{ vars.EC2_IP }}"
          ENV="${{ inputs.environment || 'dev' }}"
          if [ "$ENV" = "dev" ]; then
            DB_NAME="modulego_dev"
            PROJECT_DIR="modulego-dev"
          else
            DB_NAME="modulego"
            PROJECT_DIR="modulego-prod"
          fi

          CONTAINER=$($SSH "docker compose -f /home/ubuntu/${PROJECT_DIR}/docker-compose.yml ps -q app")
          echo "Container: ${CONTAINER}"

          if [ -z "$CONTAINER" ]; then
            echo "ERROR: App container not found"
            exit 1
          fi

          $SSH "docker cp /tmp/seed_db.py ${CONTAINER}:/app/seed_db.py"
          $SSH "docker cp /tmp/*.json ${CONTAINER}:/app/"
          $SSH "docker exec ${CONTAINER} sh -c 'DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${DB_NAME} python seed_db.py'"
          $SSH "docker exec ${CONTAINER} rm -f /app/seed_db.py /app/*.json"

      - name: Cleanup
        if: always()
        run: |
          ssh -i ~/.ssh/id.pem ubuntu@${{ vars.EC2_IP }} "rm -f /tmp/*.json /tmp/seed_db.py" || true
