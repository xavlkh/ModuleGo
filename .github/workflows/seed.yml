# Manual workflow to scrape RP data and upsert to EC2 PostgreSQL
# Trigger: Actions tab → Run workflow → pick environment
name: Seed Database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scraper dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python app/static/local-data/run_all.py

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id.pem
          chmod 600 ~/.ssh/id.pem
          ssh-keyscan -H ${{ vars.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload data and seed script to EC2
        run: |
          scp -i ~/.ssh/id.pem -o StrictHostKeyChecking=no \
            app/static/local-data/data/*.json seed_db.py \
            ubuntu@${{ vars.EC2_IP }}:/tmp/

      - name: Copy files into container and run seed
        run: |
          DB_NAME="modulego${{ inputs.environment == 'dev' && '_dev' || '' }}"
          CONTAINER=$(ssh -i ~/.ssh/id.pem ubuntu@${{ vars.EC2_IP }} \
            "cd ~/modulego-${{ inputs.environment }} && docker compose ps -q app")
          ssh -i ~/.ssh/id.pem ubuntu@${{ vars.EC2_IP }} \
            "docker cp /tmp/seed_db.py ${CONTAINER}:/app/seed_db.py && \
             docker cp /tmp/*.json ${CONTAINER}:/app/ && \
             docker exec ${CONTAINER} sh -c \
               'DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${DB_NAME} \
                python seed_db.py' && \
             docker exec ${CONTAINER} rm -f /app/seed_db.py /app/*.json"

      - name: Cleanup
        if: always()
        run: |
          ssh -i ~/.ssh/id.pem ubuntu@${{ vars.EC2_IP }} "rm -f /tmp/*.json /tmp/seed_db.py" || true
