# Manual workflow to scrape RP data and upsert to EC2 PostgreSQL
# Trigger: Actions tab → Run workflow → pick environment
name: Seed Database

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday 2am UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scraper dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python app/static/local-data/run_all.py
          echo "Scraped files:"
          ls -la app/static/local-data/data/*.json 2>&1 || echo "No JSON files found"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id.pem
          chmod 600 ~/.ssh/id.pem
          ssh-keyscan -H ${{ vars.EC2_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload files to EC2
        run: |
          if ! ls app/static/local-data/data/*.json 1>/dev/null 2>&1; then
            echo "ERROR: No JSON files found. Scraper may have failed."
            exit 1
          fi
          scp -i ~/.ssh/id.pem \
            app/static/local-data/data/*.json seed_db.py \
            ubuntu@${{ vars.EC2_IP }}:/tmp/
          echo "Verifying upload..."
          ssh -i ~/.ssh/id.pem ubuntu@${{ vars.EC2_IP }} "ls -la /tmp/seed_db.py /tmp/*.json"

      - name: Get container ID
        id: container
        run: |
          if [ "${{ inputs.environment || 'dev' }}" = "dev" ]; then
            COMPOSE_FILE="/home/ubuntu/modulego-dev/docker-compose.yml"
          else
            COMPOSE_FILE="/home/ubuntu/modulego-prod/docker-compose.yml"
          fi
          CONTAINER_ID=$(ssh -i ~/.ssh/id.pem ubuntu@${{ vars.EC2_IP }} "docker compose -f ${COMPOSE_FILE} ps -q app" | tr -d '\r\n')
          echo "id=${CONTAINER_ID}" >> "$GITHUB_OUTPUT"
          echo "Container ID: ${CONTAINER_ID}"

      - name: Copy files into container
        run: |
          CONTAINER="${{ steps.container.outputs.id }}"
          ssh -i ~/.ssh/id.pem ubuntu@${{ vars.EC2_IP }} "docker cp /tmp/seed_db.py ${CONTAINER}:/app/seed_db.py"
          ssh -i ~/.ssh/id.pem ubuntu@${{ vars.EC2_IP }} "docker cp /tmp/*.json ${CONTAINER}:/app/"

      - name: Run seed script
        run: |
          CONTAINER="${{ steps.container.outputs.id }}"
          DB_NAME="modulego"
          if [ "${{ inputs.environment || 'dev' }}" = "dev" ]; then
            DB_NAME="modulego_dev"
          fi
          ssh -i ~/.ssh/id.pem ubuntu@${{ vars.EC2_IP }} "docker exec ${CONTAINER} sh -c 'DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${DB_NAME} python seed_db.py'"

      - name: Cleanup remote files
        if: always()
        run: |
          ssh -i ~/.ssh/id.pem ubuntu@${{ vars.EC2_IP }} "rm -f /tmp/*.json /tmp/seed_db.py" || true
