apiVersion: apps/v1
kind: Deployment
metadata:
  name: modulego
  namespace: modulego
  labels:
    app: modulego
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modulego
  template:
    metadata:
      labels:
        app: modulego
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: modulego
          # Image must be built locally and loaded into minikube first.
          # See deploy.sh for the full flow.
          image: modulego:latest
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: postgresql://modulego:modulego@postgres:5432/modulego
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: modulego-app-secret
                  key: GEMINI_API_KEY
                  optional: true
            - name: GEMINI_MODEL
              value: gemini-3.1-flash-lite
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 10
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: app-tmp
              mountPath: /tmp
      # Wait for postgres to be ready before starting the app
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
      volumes:
        - name: app-data
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}
