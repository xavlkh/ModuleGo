apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: modulego
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: modulego-db-secret
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          # Slow start: give postgres time to init before k8s probes it
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "modulego"]
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "modulego"]
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
