apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: modulego
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: modulego-db-secret
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: postgres-runtime
              mountPath: /var/run/postgresql
            - name: postgres-tmp
              mountPath: /tmp
          # Slow start: give postgres time to init before k8s probes it
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "modulego"]
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "modulego"]
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-runtime
          emptyDir: {}
        - name: postgres-tmp
          emptyDir: {}
