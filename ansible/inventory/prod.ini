# Production inventory
# ansible_host is overridden via -e "ec2_ip=..." at runtime
[ec2]
modulego-prod ansible_host=PLACEHOLDER

[ec2:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/modulego-prod.pem
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o ServerAliveInterval=30 -o ServerAliveCountMax=10'
env=prod
