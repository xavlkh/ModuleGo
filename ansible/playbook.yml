---
# playbook.yml — Setup (if needed) + Deploy ModuleGo
# Safe to run multiple times:
#   ansible-playbook -i inventory/prod.ini playbook.yml -e "ansible_host=IP env=prod"
#   ansible-playbook -i inventory/dev.ini  playbook.yml -e "ansible_host=IP env=dev"

- name: Setup and Deploy ModuleGo
  hosts: ec2
  become: yes
  gather_facts: yes
  vars_files:
    - group_vars/all.yml
    - "group_vars/{{ env }}/all.yml"
  tasks:
    # ── Setup (skipped if already done) ──

    - name: Check if Docker is installed
      command: docker --version
      register: docker_check
      ignore_errors: yes
      changed_when: false

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: docker_check.rc != 0

    - name: Install Docker + Compose
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
      when: docker_check.rc != 0

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
      when: docker_check.rc != 0

    - name: Check if app directory exists
      stat:
        path: "/home/ubuntu/modulego-{{ env }}"
      register: app_dir

    - name: Login to GHCR
      command: docker login ghcr.io -u "{{ ghcr_username }}" -p "{{ ghcr_token }}"
      become_user: ubuntu
      no_log: true
      when: docker_check.rc != 0 or not app_dir.stat.exists

    - name: Create app directory
      file:
        path: "/home/ubuntu/modulego-{{ env }}"
        state: directory
        mode: "0755"
      become_user: ubuntu
      when: not app_dir.stat.exists

    - name: Copy docker-compose
      template:
        src: templates/docker-compose.ec2.yml.j2
        dest: "/home/ubuntu/modulego-{{ env }}/docker-compose.yml"
        mode: "0644"
      become_user: ubuntu
      when: not app_dir.stat.exists

    - name: Create .env file
      template:
        src: templates/env.j2
        dest: "/home/ubuntu/modulego-{{ env }}/.env"
        mode: "0600"
      become_user: ubuntu
      when: not app_dir.stat.exists

    # ── Deploy (always runs) ──

    - name: Login to GHCR
      command: docker login ghcr.io -u "{{ ghcr_username }}" -p "{{ ghcr_token }}"
      become_user: ubuntu
      no_log: true

    - name: Pull latest image
      command: docker compose pull
      args:
        chdir: "/home/ubuntu/modulego-{{ env }}"
      become_user: ubuntu

    - name: Restart containers
      command: docker compose up -d
      args:
        chdir: "/home/ubuntu/modulego-{{ env }}"
      become_user: ubuntu

    - name: Wait for app to be healthy
      uri:
        url: "http://localhost:{{ app_port }}"
        status_code: 200
      register: health
      until: health.status == 200
      retries: 15
      delay: 10

    - name: Print access URL
      debug:
        msg: "ModuleGo {{ env }} running at http://{{ ansible_default_ipv4.address }}:{{ app_port }}"
