---
# playbook.yml — Deploy ModuleGo to EC2 (prod and/or dev)
# Usage:
#   ansible-playbook -i inventory/prod.ini playbook.yml --tags deploy
#   ansible-playbook -i inventory/dev.ini  playbook.yml --tags deploy
#
# Both environments can run on the same EC2 instance (different ports)
# or on separate instances.

- name: Deploy ModuleGo
  hosts: ec2
  become: yes
  gather_facts: yes
  tags: deploy
  vars_files:
    - group_vars/all.yml
    - "group_vars/{{ env }}/all.yml"
    - secrets.yml
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker + Compose
      apt:
        name:
          - docker.io
          - docker-compose
        state: present

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # Login as ubuntu user so docker compose can pull images later
    # no_log hides the token from Ansible output
    - name: Login to GHCR
      command: docker login ghcr.io -u "{{ ghcr_username }}" -p "{{ ghcr_token }}"
      become_user: ubuntu
      no_log: true

    - name: Create app directory
      file:
        path: "/home/ubuntu/modulego-{{ env }}"
        state: directory
        mode: "0755"
      become_user: ubuntu

    - name: Copy docker-compose
      template:
        src: templates/docker-compose.ec2.yml.j2
        dest: "/home/ubuntu/modulego-{{ env }}/docker-compose.yml"
        mode: "0644"
      become_user: ubuntu

    - name: Create .env file
      template:
        src: templates/env.j2
        dest: "/home/ubuntu/modulego-{{ env }}/.env"
        mode: "0600"
      become_user: ubuntu

    - name: Pull and start containers
      command: docker compose up -d
      args:
        chdir: "/home/ubuntu/modulego-{{ env }}"
      become_user: ubuntu

    - name: Wait for app to be healthy
      uri:
        url: "http://localhost:{{ app_port }}"
        status_code: 200
      register: health
      until: health.status == 200
      retries: 15
      delay: 10

    - name: Print access URL
      debug:
        msg: "ModuleGo {{ env }} running at http://{{ ansible_default_ipv4.address }}:{{ app_port }}"
